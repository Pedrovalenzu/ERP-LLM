<!DOCTYPE html>
<html lang="es">
<head>
<title>ERP-LLM</title>
<meta charset="utf-8" />
<link rel="stylesheet" href="/static/style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="mb-5" >Almacén</h1>
    <hr>
    {% if resultado %}
        <div class="respuesta alert alert-warning shadow-sm">
            <p><strong>Resultado de la consulta:</strong> {{ resultado }}</p>
        </div>
        <hr> 
    {% endif %}
        
    <form action="/orden" method="POST">
        <div class="mb-3">
            <input type="text" name="consulta" class="form-control form-control-lg" placeholder="¿Qué desea hacer en el Almacén?" required>
            
        </div>
        <div class="d-grid"> <button type="submit" class= "btn btn-warning btn-lg" >Enviar a la IA</button> </div>
        
    </form>


<div class="container mt-5">
        <div class="row">
            
            <div class="col-md-6 mb-4">
                <div class="card shadow h-100"> <div class="card-body">
                        <h5 class="card-title">Inventario</h5>
                        <div style="position: relative; height: 300px; width: 100%;">
                            <canvas id="graficoStock" 
                                data-labels='{{ labels_productos | tojson }}' 
                                data-valores='{{ datos_productos | tojson }}'>
                            </canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h5 class="card-title">Pedidos a proveedores</h5>
                        <div style="position: relative; height: 300px; width: 100%;">
                            <canvas id="graficoProv" 
                                data-labels='{{ labels_proveedores | tojson }}' 
                                data-valores='{{ datos_proveedores | tojson }}'>
                            </canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/static/graficos.js"></script>
    

</body>
</html>
