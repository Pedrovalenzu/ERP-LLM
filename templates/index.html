<!DOCTYPE html><br>
<html lang="es"><br>
<head><br>
<title>Titulo de la web</title><br>
<meta charset="utf-8" /><br>
<link rel="stylesheet" href="/static/style.css" /><br>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="mb-5" >Almacén</h1>
    <hr>
    {% if resultado %}
        <div class="respuesta alert alert-info shadow-sm">
            <p><strong>Resultado de la consulta:</strong> {{ resultado }}</p>
        </div>
        <hr> 
    {% endif %}
        
    <form action="/orden" method="POST">
        <div class="mb-3">
            <input type="text" name="consulta" class="form-control form-control-lg" placeholder="¿Qué desea hacer en el Almacén?" required>
            
        </div>
        <div class="d-grid"> <button type="submit" class= "btn btn-secondary btn-lg" >Enviar a la IA</button> </div>
        
    </form>

    

</body>
</html>
